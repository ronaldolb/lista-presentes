server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Compressão para melhorar o PageSpeed.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Cache longo para os arquivos com hash gerados pelo Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Fallback de SPA: qualquer rota volta para o index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
